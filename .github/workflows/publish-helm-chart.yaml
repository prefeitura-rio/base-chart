name: Publish Helm Chart

on:
  push:
    branches: [master]

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CHART_DIR: chart
  REGISTRY_LOCATION: ${{ vars.REGISTRY_LOCATION || 'us-west1' }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME || 'charts' }}
  HELM_UNITTEST_VERSION: "1.1.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-unittest
        run: |
          mkdir -p "$(helm env HELM_PLUGINS)/helm-unittest"
          curl -sSL "https://github.com/helm-unittest/helm-unittest/releases/download/v${{ env.HELM_UNITTEST_VERSION }}/helm-unittest-linux-amd64-${{ env.HELM_UNITTEST_VERSION }}.tgz" \
            | tar -xz -C "$(helm env HELM_PLUGINS)/helm-unittest"

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Test
        run: helm unittest ${{ env.CHART_DIR }}

      - name: Bump patch version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject version into Chart.yaml
        run: yq e '.version = strenv(VERSION)' -i ${{ env.CHART_DIR }}/Chart.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Helm chart
        run: helm package ${{ env.CHART_DIR }} --destination ./packaged/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Helm with Artifact Registry
        run: |
          gcloud auth print-access-token \
            | helm registry login \
                -u oauth2accesstoken \
                --password-stdin \
                ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev

      - name: Push chart to Artifact Registry
        run: |
          helm push ./packaged/*.tgz \
            oci://${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHART_DIR }}/Chart.yaml
          git commit -m "chore: bump chart version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD:master
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          CHART_NAME=$(yq eval '.name' ${{ env.CHART_DIR }}/Chart.yaml)
          OCI_URL="oci://${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/$CHART_NAME"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')

          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --notes-start-tag "$PREV_TAG" \
            --notes "## Helm Chart $CHART_NAME $TAG

          ### Installation

          \`\`\`bash
          helm install my-release $OCI_URL --version $VERSION
          \`\`\`

          ### Pull

          \`\`\`bash
          helm pull $OCI_URL --version $VERSION
          \`\`\`"
