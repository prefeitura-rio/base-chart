name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART_DIR: chart
  HELM_UNITTEST_VERSION: "1.1.0"
  REGISTRY_LOCATION: ${{ vars.REGISTRY_LOCATION || 'us-west1' }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REPOSITORY_NAME: ${{ vars.REPOSITORY_NAME || 'charts' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Cache helm-unittest binary
        id: cache-unittest
        uses: actions/cache@v4
        with:
          path: ~/.local/share/helm/plugins/helm-unittest
          key: helm-unittest-${{ env.HELM_UNITTEST_VERSION }}-linux-amd64

      - name: Install helm-unittest
        if: steps.cache-unittest.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(helm env HELM_PLUGINS)/helm-unittest"
          curl -sSL "https://github.com/helm-unittest/helm-unittest/releases/download/v${{ env.HELM_UNITTEST_VERSION }}/helm-unittest-linux-amd64-${{ env.HELM_UNITTEST_VERSION }}.tgz" \
            | tar -xz -C "$(helm env HELM_PLUGINS)/helm-unittest"

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Test
        run: helm unittest ${{ env.CHART_DIR }}

  publish:
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Cache helm-unittest binary
        id: cache-unittest
        uses: actions/cache@v4
        with:
          path: ~/.local/share/helm/plugins/helm-unittest
          key: helm-unittest-${{ env.HELM_UNITTEST_VERSION }}-linux-amd64

      - name: Install helm-unittest
        if: steps.cache-unittest.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(helm env HELM_PLUGINS)/helm-unittest"
          curl -sSL "https://github.com/helm-unittest/helm-unittest/releases/download/v${{ env.HELM_UNITTEST_VERSION }}/helm-unittest-linux-amd64-${{ env.HELM_UNITTEST_VERSION }}.tgz" \
            | tar -xz -C "$(helm env HELM_PLUGINS)/helm-unittest"

      - name: Bump patch version and push tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Inject version into Chart.yaml
        run: yq e '.version = strenv(VERSION)' -i ${{ env.CHART_DIR }}/Chart.yaml
        env:
          VERSION: ${{ steps.version.outputs.new_version }}

      - name: Package Helm chart
        run: helm package ${{ env.CHART_DIR }} --destination ./packaged/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Helm with Artifact Registry
        run: |
          gcloud auth print-access-token \
            | helm registry login \
                -u oauth2accesstoken \
                --password-stdin \
                ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev

      - name: Push chart to Artifact Registry
        run: |
          helm push ./packaged/*.tgz \
            oci://${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CHART_DIR }}/Chart.yaml
          git commit -m "chore: bump chart version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push origin HEAD:master

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.new_tag }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          CHART_NAME=$(yq eval '.name' ${{ env.CHART_DIR }}/Chart.yaml)
          OCI_URL="oci://${{ env.REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/$CHART_NAME"

          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --notes-start-tag "$PREV_TAG" \
            --notes "## Helm Chart $CHART_NAME $TAG

          ### Installation

          \`\`\`bash
          helm install my-release $OCI_URL --version $VERSION
          \`\`\`

          ### Pull

          \`\`\`bash
          helm pull $OCI_URL --version $VERSION
          \`\`\`"
